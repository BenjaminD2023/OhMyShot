# Safe to rerun after publication: no release creation, signing keys, installs, or repository writes.
name: Verify release distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected latest version (without v)
        type: string
        required: true
      build:
        description: Expected latest build number
        type: string
        required: true
      sha256:
        description: SHA-256 of the original signed release ZIP from the build artifact
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      build:
        type: string
        required: true
      sha256:
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest # CryptoKit verifies with the public key; no signing setup or app build.
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      BUILD: ${{ inputs.build }}
      EXPECTED_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the distribution verifier offline
        run: python3 -B -m unittest discover -s Scripts/tests -p 'test_*.py' -v

      - name: Verify the website and Sparkle downloads
        shell: bash
        run: |
          set -euo pipefail
          # Bounded retries accommodate publication/cache propagation. Each attempt retains its own report.
          for attempt in 1 2 3; do
            output="build/distribution-check/attempt-$attempt"
            mkdir -p "$output"
            if python3 -I Scripts/check-distribution.py --version "$VERSION" --build "$BUILD" \
              --sha256 "$EXPECTED_SHA256" --output "$output" 2>&1 | tee "$output/check.log"; then
              echo "Verified $VERSION (build $BUILD), SHA-256: $EXPECTED_SHA256" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" != 3 ]; then sleep 20; fi
          done
          echo "::error::Public release verification failed. Inspect the reports and rerun Verify release distribution; do not republish."
          exit 1

      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/distribution-check/**/report.json
            build/distribution-check/**/check.log
            build/distribution-check/**/appcast.xml
          if-no-files-found: warn
