# XcodeGen spec. Generate the project with Scripts/bootstrap.sh; never edit the .xcodeproj by hand.
# Target build settings live in Config/*.xcconfig, so the generated project carries none of its own.

name: OhMyShot
options:
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  settingPresets: project
  groupSortPosition: top

packages:
  OhMyShotKit:
    path: Packages/OhMyShotKit
  # The VLM pack's model on MLX, linked by the text reader alone (Packages/OhMyShotVLM/Package.swift).
  OhMyShotVLM:
    path: Packages/OhMyShotVLM
  # Updates for release builds (MIT). Only the app links it; its feed is set in Config/Release.xcconfig.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  OhMyShot:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: App
        type: syncedFolder
      - path: Config
        buildPhase: none
    dependencies:
      - package: OhMyShotKit
        product: OMSCore
      - package: OhMyShotKit
        product: OMSCapture
      - package: OhMyShotKit
        product: OMSUI
      - package: OhMyShotKit
        product: OMSOCR
      - package: OhMyShotKit
        product: OMSAnnotate
      - package: OhMyShotKit
        product: OMSRecording
      - package: OhMyShotKit
        product: OMSStudio
      - package: Sparkle
      - target: TextReader
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: ShareExtension
        embed: true
        codeSign: true
    postBuildScripts:
      # MLX's precompiled Metal kernels (the rest it compiles when first used), which the text reader finds in the
      # app's Resources: a command-line tool has no resources of its own.
      - name: Copy MLX's Metal library
        # Only the files declared below: Xcode's script sandbox lets a script write nothing else.
        script: |
          set -e
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")" "$(dirname "$SCRIPT_OUTPUT_FILE_1")"
          cp "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
          cp "$SCRIPT_INPUT_FILE_1" "$SCRIPT_OUTPUT_FILE_1"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/mlx-swift_Cmlx.bundle/Contents/Info.plist
          - $(BUILT_PRODUCTS_DIR)/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mlx-swift_Cmlx.bundle/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib
        basedOnDependencyAnalysis: true

  # Reads the text in captures for Capture History's search, in a process of its own (see main.swift).
  TextReader:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/TextReader-Debug.xcconfig
      Release: Config/TextReader-Release.xcconfig
    sources:
      - path: Helpers/TextReader
    dependencies:
      - package: OhMyShotKit
        product: OMSOCR
      - package: OhMyShotKit
        product: OMSCore
      - package: OhMyShotVLM
        product: OMSVLM

  # OhMyShot in any app's Share menu: pictures to annotate or pin, handed over through the Share Inbox (see
  # Extensions/Share/ShareViewController.swift). Sandboxed, as extensions must be; the app is not.
  ShareExtension:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/ShareExtension-Debug.xcconfig
      Release: Config/ShareExtension-Release.xcconfig
    sources:
      - path: Extensions/Share
      - path: App/AppIcon.icon
    dependencies:
      - package: OhMyShotKit
        product: OMSCore

schemes:
  OhMyShot:
    build:
      targets:
        OhMyShot: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
